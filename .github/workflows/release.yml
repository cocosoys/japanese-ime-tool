name: Build and Release

# 自动发布方法（原生 gh CLI，不依赖第三方 Action，避免 Node 24 不兼容问题）：
# 当 push 到 main 的 commit message 形如 "Release: x.y.z" 时，
#  1) 在 Windows 上构建 NSIS 安装版 + 便携版 + app-x.y.z.asar（输出到 release/x.y.z/）
#  2) 用 gh release create 按 commit 版本号自动创建 GitHub Release
#     - 描述取自 CHANGELOG.md 中 "## v<x.y.z>" 小节（找不到则自动生成）
#     - 把三件套（Setup / Portable / asar）上传为 Release 资产
#  3) 步骤幂等：重跑时若同名 release/tag 已存在会先清理，便于修复后重新发布
#
# 触发一次发布的本地操作：
#   修改 package.json 的 version 与 CHANGELOG.md
#   git add -A && git commit -m "Release: 1.0.1" && git push
on:
  push:
    branches: [main]

jobs:
  release:
    # 仅当 commit subject 以 "Release:" 开头才执行构建与发布，普通提交直接跳过
    if: startsWith(github.event.head_commit.message, 'Release:')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (NSIS + Portable + asar → release/<version>/)
        env:
          # CI 上无代码签名证书，禁用 electron-builder 自动发现/使用证书签名，
          # 避免对 exe 执行不可控的 signtool 签名；签名可在本地用 scripts/local-release 完成。
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist

      - name: Derive version & validate consistency
        id: vars
        shell: bash
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          MSG_VER=$(git log -1 --pretty=%s | sed -n 's/^Release: //p')
          echo "VERSION=$PKG_VER" >> "$GITHUB_OUTPUT"
          echo "package.json version: $PKG_VER"
          echo "commit subject: $(git log -1 --pretty=%s)"
          if [ -n "$MSG_VER" ] && [ "$MSG_VER" != "$PKG_VER" ]; then
            echo "::error::Commit 版本 ($MSG_VER) 与 package.json 版本 ($PKG_VER) 不一致，请先同步 package.json 再提交 Release。"
            exit 1
          fi

      - name: Create Release & upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.vars.outputs.VERSION }}"
          echo "Releasing version: $VER"

          # 从 CHANGELOG.md 抽取 "## v<x.y.z>" 小节作为 Release 描述
          awk "/^## v${VER}/{f=1;next} /^## /{if(f)exit} f" CHANGELOG.md > /tmp/notes.md
          if [ -s /tmp/notes.md ]; then
            echo "使用 CHANGELOG.md 中 ## v${VER} 小节作为描述"
            NOTES=(--notes-file /tmp/notes.md)
          else
            echo "未找到 CHANGELOG 对应小节，改用自动生成描述"
            NOTES=(--generate-notes)
          fi

          TAG="v${VER}"
          # 幂等清理：重跑时若已存在同名 release/tag 先删除
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$TAG" 2>/dev/null || true

          gh release create "$TAG" \
            --title "Release: ${VER}" \
            "${NOTES[@]}" \
            "release/${VER}/JapaneseImeTool Setup ${VER}.exe" \
            "release/${VER}/JapaneseImeTool Portable ${VER}.exe" \
            "release/${VER}/app-${VER}.asar"

          echo "Release 创建完成：https://github.com/${{ github.repository }}/releases/tag/${TAG}"
