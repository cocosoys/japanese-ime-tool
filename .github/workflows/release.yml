name: Build and Release (auto-release)

# 自动发布方法（基于 CupOfTea696/gh-action-auto-release）：
# 当 push 到 main 的 commit message 形如 "Release: x.y.z" 时，
#  1) 在 Windows 上构建 NSIS 安装版 + 便携版 + app-x.y.z.asar（输出到 release/x.y.z/）
#  2) auto-release 按 commit 版本号自动创建 GitHub Release（描述取自 CHANGELOG.md 对应小节）
#  3) 通过 auto-release 输出的 upload_url，把三件套 + version.json 上传为 Release 资产
#
# 触发一次发布的本地操作：
#   修改 package.json 的 version 与 CHANGELOG.md
#   git add -A && git commit -m "Release: 1.0.1" && git push
on:
  push:
    branches: [main]

jobs:
  release:
    # 仅当 commit subject 以 "Release:" 开头才执行构建与发布，普通提交直接跳过
    if: startsWith(github.event.head_commit.message, 'Release:')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (NSIS + Portable + asar → release/<version>/)
        env:
          # CI 上无代码签名证书，禁用 electron-builder 自动发现/使用证书签名，
          # 避免对 exe 执行不可控的 signtool 签名；签名可在本地用 scripts/local-release 完成。
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist

      - name: Derive version & validate consistency
        id: vars
        shell: bash
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          MSG_VER=$(git log -1 --pretty=%s | sed -n 's/^Release: //p')
          echo "VERSION=$PKG_VER" >> "$GITHUB_OUTPUT"
          echo "package.json version: $PKG_VER"
          echo "commit subject: $(git log -1 --pretty=%s)"
          if [ -n "$MSG_VER" ] && [ "$MSG_VER" != "$PKG_VER" ]; then
            echo "::error::Commit 版本 ($MSG_VER) 与 package.json 版本 ($PKG_VER) 不一致，请先同步 package.json 再提交 Release。"
            exit 1
          fi

      - name: Auto Release (create release from commit + CHANGELOG)
        id: auto_release
        uses: CupOfTea696/gh-action-auto-release@v1.0.0
        with:
          title: "Release: $version"
          tag: "v$semver"
          draft: false
          regex: "/^Release: #{semver}$/i"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Setup (NSIS)
        if: steps.auto_release.outputs.released == 'true'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.auto_release.outputs.upload_url }}
          asset_path: release/${{ steps.vars.outputs.VERSION }}/JapaneseImeTool Setup ${{ steps.vars.outputs.VERSION }}.exe
          asset_name: JapaneseImeTool Setup ${{ steps.vars.outputs.VERSION }}.exe
          asset_content_type: application/octet-stream

      - name: Upload Portable
        if: steps.auto_release.outputs.released == 'true'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.auto_release.outputs.upload_url }}
          asset_path: release/${{ steps.vars.outputs.VERSION }}/JapaneseImeTool Portable ${{ steps.vars.outputs.VERSION }}.exe
          asset_name: JapaneseImeTool Portable ${{ steps.vars.outputs.VERSION }}.exe
          asset_content_type: application/octet-stream

      - name: Upload asar (in-app update payload)
        if: steps.auto_release.outputs.released == 'true'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.auto_release.outputs.upload_url }}
          asset_path: release/${{ steps.vars.outputs.VERSION }}/app-${{ steps.vars.outputs.VERSION }}.asar
          asset_name: app-${{ steps.vars.outputs.VERSION }}.asar
          asset_content_type: application/octet-stream

      - name: Upload version.json (update manifest)
        if: steps.auto_release.outputs.released == 'true'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.auto_release.outputs.upload_url }}
          asset_path: version.json
          asset_name: version.json
          asset_content_type: application/json
